name: Security and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject private artifacts and identifiers
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"], text=False
          ).split(b"\0")

          forbidden_names = {
              ".env",
              "secrets.yaml",
              "wifi_radar.json",
              "events.json",
              "home-assistant_v2.db",
          }
          errors: list[str] = []
          patterns = {
              "personal Unix path": re.compile(r"/" + r"home/" + r"[A-Za-z0-9._-]+/"),
              "personal Windows path": re.compile(r"[A-Za-z]:" + r"\\Users\\" + r"[^\\\s]+"),
              "MAC-like identifier": re.compile(
                  r"(?i)(?:[0-9a-f]{2}[:-]){5}[0-9a-f]{2}"
              ),
              "assigned credential": re.compile(
                  r"(?i)(?:password|passwd|token|api[_-]?key|secret)"
                  r"\s*[:=]\s*['\"]?[A-Za-z0-9_./+=-]{12,}"
              ),
              "Home Assistant bearer token": re.compile(r"eyJ[\w-]+\.eyJ[\w-]+\.[\w-]+"),
              "private IPv4 address": re.compile(
                  r"(?<![\d.])(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|"
                  r"192\.168\.\d{1,3}\.\d{1,3}|"
                  r"172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})(?![\d.])"
              ),
          }

          for raw_name in tracked:
              if not raw_name:
                  continue
              name = raw_name.decode("utf-8", "surrogateescape")
              path = Path(name)
              if path.name in forbidden_names or path.suffix.lower() in {
                  ".key", ".pem", ".p12", ".pfx"
              }:
                  errors.append(f"forbidden tracked artifact: {name}")
                  continue
              try:
                  data = path.read_bytes()
              except OSError as exc:
                  errors.append(f"cannot inspect {name}: {exc}")
                  continue
              if b"\0" in data[:8192]:
                  continue
              text = data.decode("utf-8", "replace")
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      errors.append(f"{label}: {name}")

          if errors:
              print("Public-release validation failed:")
              print("\n".join(f"- {item}" for item in sorted(set(errors))))
              raise SystemExit(1)
          print("No forbidden public identifiers detected.")
          PY

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest
          if [[ -f requirements.txt ]]; then
            python -m pip install --disable-pip-version-check -r requirements.txt
          fi

      - name: Run tests when present
        shell: bash
        run: |
          if find . -type f -name 'test_*.py' -not -path './.git/*' -print -quit | grep -q .; then
            python -m pytest -q
          else
            echo "No pytest tests found; skipping."
          fi
